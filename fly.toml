app = "toplarss"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  DB_PATH = "/app/data/feeds.db"
  PW_MAX_PAGES = "2"
  PW_NO_SANDBOX = "1"

[mounts]
  source = "toplarss_data"
  destination = "/app/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
